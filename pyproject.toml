[project]
name = "ph2651-analysis"
version = "0.0.1"
description = "Data analysis programs for PH2651: Intermediate Physics Laboratory"
dependencies = [
    "findpeaks>=2.7.5",
    "manim>=0.20.1",
    "matplotlib>=3.10.8",
    "numpy>=2.4.4",
    "scipy>=1.17.1",
    "statsmodels>=0.14.6",
    "uncertainties>=3.2.3",
]

[tool.ruff]
line-length = 80
[tool.ruff.lint]
# isort
extend-select = ["I001", "I002"]
[tool.ruff.lint.per-file-ignores]
"quantum_crypto_manim.py" = ["F403", "F405"]
